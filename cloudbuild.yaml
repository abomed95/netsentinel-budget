# Google Cloud Build — build de l'image, push vers Artifact Registry, déploiement Cloud Run.
#
# Prérequis (une seule fois) :
#   gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com
#   gcloud artifacts repositories create netsentinel --repository-format=docker --location=${_REGION}
#
# Lancement :
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1
#
# Variables substituables (valeurs par défaut ci-dessous, surchargeables via --substitutions) :
substitutions:
  _REGION: europe-west1
  _SERVICE: netsentinel
  _REPO: netsentinel

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

steps:
  # 1. Build de l'image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - .

  # 2. Push vers Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"

  # 3. Déploiement sur Cloud Run
  #    --allow-unauthenticated : API publique pour la démo. Pour restreindre l'accès,
  #    retirer ce flag et/ou définir le secret NETSENTINEL_API_KEY (voir --set-secrets).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      # Stockage EN MÉMOIRE non partagé : garder max-instances=1 tant qu'aucun
      # stockage externe n'est branché (sinon historique/alertes incohérents).
      # Pour activer l'auth par clé API :
      # - "--set-secrets=NETSENTINEL_API_KEY=netsentinel-api-key:latest"

options:
  logging: CLOUD_LOGGING_ONLY
