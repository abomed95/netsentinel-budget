name: NetSentinel CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-api:
    name: Tests de l'API FastAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      # Un échec de test doit faire échouer le job : l'ancienne version le masquait.
      - name: Tests
        run: python -m pytest

  # Le job « build-frontend » d'origine est retiré tant que les sources du tableau de
  # bord (package.json, reseau-prediction.jsx) ne sont pas dans le dépôt : il ne
  # pouvait qu'échouer. À rétablir avec elles :
  #
  #   build-frontend:
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-node@v4
  #         with: { node-version: '20', cache: 'npm' }
  #       - run: npm ci
  #       - run: npm run build
